# Order Service - Test Configuration
# This file is loaded automatically by the 'config' npm package when NODE_ENV=test

server:
  port: 5503

database:
  url: "mongodb://localhost:27017/order-service-test"

kafka:
  broker:
    - "localhost:9092"
  # Only read on the production branch of src/config/kafka.ts, but node-config
  # throws on get() of an undefined key — so these have to exist for
  # tests/common/kafka.spec.ts to exercise that branch at all. Same reason
  # config/production.yaml declares them.
  ssl: true
  sasl:
    username: "test-user"
    password: "test-password"

frontend:
  clientUI: "http://localhost:5173"
  adminUI: "http://localhost:5174"

auth:
  jwksUri: "http://localhost:5501/.well-known/jwks.json"

stripe:
  secretKey: "sk_test_placeholder"
